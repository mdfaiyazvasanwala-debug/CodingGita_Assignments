<!-- Q22. Event-driven programming -->

<!DOCTYPE html>
<html>
<head>
    <title>Event Example</title>
</head>
<body>

<p id="demo">Click the button.</p>
<button id="myBtn">Click Me</button>

<script>
document.getElementById("myBtn").addEventListener("click", function() {
    document.getElementById("demo").textContent = "Button was clicked!";
});
</script>

</body>
</html>


<!-- Explanation: The click event triggers the function when the user clicks the button. -->

Q23. Complete HTML + JavaScript Code
 -->


<!DOCTYPE html>
<html>
<head>
    <title>My First JavaScript Page</title>
</head>
<body>

    <h1>My First JavaScript Page</h1>

    <button onclick="changePage()">Click Me</button>

    <script>
        console.log("JavaScript is running successfully!");

        function changePage() {
            alert("Hello, B.Tech Student!");
            document.body.style.backgroundColor = "lightblue";
        }
    </script>

</body>
</html>

<!-- Output/Working:

Displays the heading My First JavaScript Page.
Clicking Click Me shows the alert.
Background changes to light blue.
The message appears in the browser console. -->
